[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlmpeg"
version = "0.9.0"
description = "SQL frontend for FFmpeg filtergraphs"
readme = "README.md"
keywords = ["ffmpeg", "sql", "filter", "filtergraphs"]
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
    "Programming Language :: SQL",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
]
authors = [
  { name="Jon-Carlos Rivera", email="jon.carlos.rivera@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/imbcmdth/sqlmpeg"

[tool.setuptools]
packages = ["sqlmpeg"]

# `packages = [...]` above is an explicit list, not automatic discovery, so
# setuptools ships only `.py` files by default -- `reference_registry.json`
# (plan 050's vendored reference snapshot, RFC-007) needs an explicit
# package-data entry or it is silently absent from built wheels/sdists
# (editable installs are unaffected: `pip install -e .` resolves imports
# straight from the source tree via a finder, package-data or not).
[tool.setuptools.package-data]
sqlmpeg = ["reference_registry.json"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
    "imagehash",
]

[project.scripts]
sqlmpeg = "sqlmpeg.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

# numpy 2.5 stubs use PEP 695 syntax that mypy rejects under a 3.10 target;
# numpy is only a transitive test dep (pytest -> TYPE_CHECKING, imagehash).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
markers = ["exec: end-to-end tests that execute ffmpeg"]
addopts = "-m \"not exec\""
