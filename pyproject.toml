[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlmpeg"
version = "0.1.0"
description = "SQL frontend for FFmpeg filtergraphs"
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
]

[tool.setuptools]
packages = ["sqlmpeg"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
    "imagehash",
]

[project.scripts]
sqlmpeg = "sqlmpeg.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
markers = ["exec: end-to-end tests that execute ffmpeg"]
addopts = "-m \"not exec\""
