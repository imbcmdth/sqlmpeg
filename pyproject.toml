[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlmpeg"
version = "0.26.0"
description = "SQL frontend for FFmpeg filtergraphs"
readme = "README.md"
keywords = ["ffmpeg", "sql", "filter", "filtergraphs"]
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
    "static-ffmpeg",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
    "Programming Language :: SQL",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
]
authors = [
  { name="Jon-Carlos Rivera", email="jon.carlos.rivera@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/imbcmdth/sqlmpeg"

# Found, not listed: a subpackage added under sqlmpeg/ ships in the wheel
# without a pyproject edit. An explicit list omits it silently -- an editable
# install keeps working while the wheel is missing the code.
[tool.setuptools.packages.find]
include = ["sqlmpeg*"]

[project.optional-dependencies]
# `sqlmpeg mcp` only; the compiler and the CLI never import it. Kept optional
# because it drags in a web stack (pydantic, starlette, uvicorn) that a user
# who only compiles SQL has no use for.
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
    "imagehash",
    # So CI type-checks and exercises the MCP server; the suite skips those
    # tests rather than failing when it is absent.
    "sqlmpeg[mcp]",
]

[project.scripts]
sqlmpeg = "sqlmpeg.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

# numpy 2.5 stubs use PEP 695 syntax that mypy rejects under a 3.10 target;
# numpy is only a transitive test dep (pytest -> TYPE_CHECKING, imagehash).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# static-ffmpeg ships no py.typed marker; mypy --strict refuses to import it
# at all (even lazily, inside a try/except) without this.
[[tool.mypy.overrides]]
module = ["static_ffmpeg", "static_ffmpeg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["exec: end-to-end tests that execute ffmpeg"]
addopts = "-m \"not exec\""
