name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install sqlmpeg with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy, strict on sqlmpeg/)
        run: mypy sqlmpeg/

      - name: Test (pytest, exec tests excluded by default)
        run: python -m pytest tests/ -q

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate synthetic media fixtures
        run: python scripts/gen_fixtures.py

      - name: Exec tests (real ffmpeg)
        run: python -m pytest -m exec tests/ -q
