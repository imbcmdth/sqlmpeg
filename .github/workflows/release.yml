name: Release

# Runs only for version tags, and only if the tagged commit is on main.
# Green tests are the ONLY road to PyPI: build and publish run after the
# full suite (default tier bare, exec tier against provisioned ffmpeg).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${GITHUB_REF_NAME} points at a commit not on main; refusing to release"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install sqlmpeg with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy, strict on sqlmpeg/)
        run: mypy sqlmpeg/

      # No ffmpeg yet, on purpose: the default suite must pass on a bare
      # machine, compiling against tests/data/reference_registry.json.
      - name: Test (pytest, exec tests excluded by default)
        run: python -m pytest tests/

      # The provisioner sqlmpeg ships, not apt: same path a bare user
      # machine takes.
      - name: Provision ffmpeg (static-ffmpeg)
        timeout-minutes: 8
        run: |
          python -c "import os; from static_ffmpeg import run; print(os.path.dirname(run.get_or_fetch_platform_executables_else_raise()[0]))" >> "$GITHUB_PATH"

      - name: Generate synthetic media fixtures
        run: python scripts/gen_fixtures.py

      - name: Exec tests (real ffmpeg)
        run: python -m pytest -m exec tests/

      - name: Build
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish
